name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # tasks.py deliberately does not vendor datafile.py; it locates one at
      # runtime. Both repos are checked out as siblings, which is the layout
      # tasks.py already falls back to, so CI exercises the real lookup rather
      # than a special case. No ref is pinned: tasks.py builds on datafile
      # internals (Store, toon, AxiError, the hook helpers), so this job is
      # also the integration test for that coupling, and it should go red when
      # datafile moves under it.
      - uses: actions/checkout@v7
        with:
          path: tasks

      - uses: actions/checkout@v7
        with:
          repository: vvonkledge/datafile
          path: datafile

      # No cache. Dependencies are declared as open ranges in the inline script
      # metadata of tasks.py and test_tasks.py, and this repo ships no lockfile
      # for them to be keyed on, so every cache key here is static: CI would
      # keep resolving to whatever wheels it first cached and stop noticing that
      # pydantic or pyyaml moved. That is the same drift the unpinned datafile
      # checkout above exists to catch. `auto` is not enough, since it enables
      # the cache on this runner and re-raises the never-invalidated warning.
      #
      # Pinned to a full version, unlike checkout above: setup-uv stopped
      # publishing floating major tags in v8, so `@v10` does not resolve. Bump
      # this by hand; nothing moves it for you.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Lint
        working-directory: tasks
        run: uvx ruff check .

      - name: Tests
        working-directory: tasks
        env:
          TASKS_DATAFILE: ${{ github.workspace }}/datafile/datafile.py
        run: uv run test_tasks.py -q

      # tasks.py generates its agent skill from the argparse tree, so adding a
      # command or a flag silently stales the committed copy. The skill carries
      # no machine-specific path, so this check is portable.
      #
      # `pi-package --check` is deliberately NOT run here: it bakes the
      # generating machine's absolute path into README.md and
      # extensions/ambient-context.ts as a PATH fallback, so it can only pass on
      # the machine that generated it.
      - name: Generated skill is current
        working-directory: tasks
        env:
          TASKS_DATAFILE: ${{ github.workspace }}/datafile/datafile.py
        run: uv run tasks.py skill --check
