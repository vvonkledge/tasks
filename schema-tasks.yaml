# Contract for tasks.jsonl. Generated by `tasks.py init`; edit freely.
name: Task
key: id
extra: forbid

fields:
  id:          {type: str, pattern: '^[a-z][a-z0-9-]{2,47}$'}
  title:       {type: str, min_length: 1, max_length: 120}
  status:      {type: enum, values: [todo, doing, done, blocked], default: todo}
  verify:      {type: str, min_length: 1}
  verify_kind: {type: enum, values: [cmd, prose], default: cmd}
  deps:        {type: list, items: str, default: []}
  context:     {type: list, items: str, default: []}
  cwd:         {type: str, required: false}
  owner:       {type: str, required: false}
  reason:      {type: str, required: false}
  updated:     {type: datetime}
