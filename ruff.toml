# Lint config for tasks.py. Like datafile.py it carries PEP 723 inline
# dependencies and is run with `uv run`, so there is no pyproject.toml to hang
# this off - hence a standalone ruff.toml. Kept in step with ../datafile.
#
#   uvx ruff check .          # lint
#   uvx ruff check --fix .    # apply the safe fixes

target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "RUF"]

ignore = [
    # tasks.py imports its dependencies below the version fast path on purpose,
    # so `--version` costs interpreter startup and nothing else.
    "E402",
]
